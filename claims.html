<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const PIN_ROLE='office';
// ================= الاتصال بالسيستم (Google Sheets) =================
// الصق هنا رابط Web App اللي هتاخده من Apps Script (بينتهي بـ /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbwmp0dESFjbzXfsjB_TRgWRx86PvrkfYsxefDVy8wxjYqVd3WO76gj_gGuRIhXZ1G0_/exec';
const PIN_KEY = 'damarany_pin_' + PIN_ROLE;
const NAME_KEY = 'damarany_user_name';

function dkLS(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ''; } }
function dkGetPin() { return dkLS(PIN_KEY); }
function dkGetName() { return dkLS(NAME_KEY); }
function dkErr(code, msg) { const e = new Error(msg); e.code = code; return e; }
function dkEsc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

async function dkApi(action, payload) {
  if (!API_URL) throw dkErr('NO_API', 'السيستم لسه مش متوصل. حط رابط API_URL في أول الملف.');
  let res, j;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, pin: dkGetPin(), by: dkGetName() }, payload || {})) });
  } catch (e) { throw dkErr('NETWORK', 'مفيش اتصال بالإنترنت'); }
  try { j = await res.json(); } catch (e) { throw dkErr('NETWORK', 'السيستم مردش صح، جرب تاني'); }
  if (!j.ok) {
    if (j.code === 'BAD_PIN') dkLS(PIN_KEY, null);
    throw dkErr(j.code || 'ERROR', j.error || 'حصل خطأ');
  }
  return j;
}

function dkToast(t, ms) {
  let x = document.getElementById('dkToast');
  if (!x) { x = document.createElement('div'); x.id = 'dkToast'; document.body.appendChild(x); }
  x.textContent = t; x.style.display = 'block';
  clearTimeout(x._t); x._t = setTimeout(() => x.style.display = 'none', ms || 2800);
}

function dkBusy(on, text) {
  let x = document.getElementById('dkBusy');
  if (!x) { x = document.createElement('div'); x.id = 'dkBusy'; x.innerHTML = '<div><span class="dk-spin"></span><b></b></div>'; document.body.appendChild(x); }
  x.querySelector('b').textContent = text || 'جارٍ الحفظ…';
  x.style.display = on ? 'flex' : 'none';
}

let dkPinPromise = null;
// يطلب رمز الدخول (ومعاه الاسم لو مطلوب) ويتأكد منه من السيستم
function dkAskPin(opts) {
  opts = opts || {};
  if (dkPinPromise) return dkPinPromise;
  dkPinPromise = new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'dk-overlay';
    ov.innerHTML = `<div class="dk-sheet"><h3>${dkEsc(opts.title || 'رمز الدخول')}</h3>
      <p class="dk-muted">${dkEsc(opts.hint || 'الرمز بيتطلب مرة واحدة على الجهاز ده.')}</p>
      ${opts.askName ? `<label>اسمك</label><input id="dkName" autocomplete="name" placeholder="الاسم اللي هيظهر في السجل" value="${dkEsc(dkGetName())}">` : ''}
      <label>الرمز</label><input id="dkPin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
      <div class="dk-err" id="dkPinErr"></div>
      <button type="button" class="dk-btn" id="dkPinGo">دخول</button></div>`;
    document.body.appendChild(ov);
    const pinEl = ov.querySelector('#dkPin'), err = ov.querySelector('#dkPinErr'), go = ov.querySelector('#dkPinGo');
    setTimeout(() => (opts.askName && !dkGetName() ? ov.querySelector('#dkName') : pinEl).focus(), 50);
    const submit = async () => {
      const pin = pinEl.value.trim();
      const name = opts.askName ? ov.querySelector('#dkName').value.trim() : dkGetName();
      if (opts.askName && !name) { err.textContent = 'اكتب اسمك'; return; }
      if (!pin) { err.textContent = 'اكتب الرمز'; return; }
      dkLS(PIN_KEY, pin); if (name) dkLS(NAME_KEY, name);
      go.disabled = true; go.textContent = 'جارٍ التأكد…'; err.textContent = '';
      try {
        await dkApi('ping', { need: PIN_ROLE });
      } catch (e) {
        go.disabled = false; go.textContent = 'دخول';
        if (e.code === 'NETWORK') { dkToast('مفيش نت دلوقتي. الرمز اتسجل وهيتأكد أول ما النت يرجع'); }
        else { err.textContent = e.code === 'BAD_PIN' ? 'الرمز غلط' : e.message; return; }
      }
      ov.remove(); dkPinPromise = null; resolve(pin);
    };
    go.onclick = submit;
    pinEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  });
  return dkPinPromise;
}

// يتأكد إن فيه رمز متسجل قبل أي شغل مع السيستم
async function dkEnsurePin(opts) {
  if (!API_URL) return false;
  if (dkGetPin() && (!opts || !opts.askName || dkGetName())) return true;
  await dkAskPin(opts);
  return true;
}

// يكرر الطلب لو الرمز اتغير
async function dkCall(action, payload, opts) {
  try { return await dkApi(action, payload); }
  catch (e) {
    if (e.code !== 'BAD_PIN') throw e;
    dkToast('الرمز اتغير، ادخل الرمز الجديد');
    await dkAskPin(opts);
    return dkApi(action, payload);
  }
}

// تصغير الصور قبل الرفع (بيوفر نت ومساحة)
function dkShrinkImage(file, maxSide, quality) {
  maxSide = maxSide || 1600; quality = quality || 0.75;
  return new Promise((resolve) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { resolve(c.toDataURL('image/jpeg', quality)); } catch (e) { resolve(fr.result); }
      };
      img.onerror = () => resolve(fr.result);
      img.src = fr.result;
    };
    fr.onerror = () => resolve('');
    fr.readAsDataURL(file);
  });
}
function dkDataUrlParts(d) { const m = /^data:([^;]+);base64,(.*)$/.exec(d || ''); return m ? { mime: m[1], base64: m[2] } : null; }
// =====================================================================


// ===== تحويل التقارير لـ PDF بخط عربي ثابت (الكلام مبيلزقش في بعضه وبيطلع نفس الشكل على أي موبايل) =====
// بيرسم الصفحة كصورة عالية الجودة جوه PDF، وبيقطع الصفحات بين الصفوف مش في نصها.
// ممكن نجمع أكتر من جزء في ملف واحد (مثلا الحصر طولي + المستخلص عرضي).
const DK_FONT_RANGES = { arabic: 'U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC', latin: 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD' };
const DK_FONTS = {
  sans: { family: 'DKSans', base: 'https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-arabic@5.3.0/files/noto-sans-arabic-', fallback: 'Tahoma, Arial, sans-serif' }
};
const dkFontCache = {};
// بيرجع {css, family}: الـ css فيه الخط نفسه عشان يتحط جوه التقرير. لو النت فصل بنستخدم خط الجهاز.
async function dkLoadFont(key) {
  if (dkFontCache[key]) return dkFontCache[key];
  const f = DK_FONTS[key];
  try {
    const faces = await Promise.all([['arabic', 400], ['arabic', 700], ['latin', 400], ['latin', 700]].map(async ([sub, w]) => {
      const r = await fetch(f.base + sub + '-' + w + '-normal.woff2'); if (!r.ok) throw new Error('font');
      const blob = await r.blob();
      const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
      try { const ff = new FontFace(f.family, 'url(' + data + ')', { weight: String(w), unicodeRange: DK_FONT_RANGES[sub] }); await ff.load(); document.fonts.add(ff); } catch (e) { }
      return "@font-face{font-family:'" + f.family + "';font-weight:" + w + ';src:url(' + data + ") format('woff2');unicode-range:" + DK_FONT_RANGES[sub] + '}';
    }));
    dkFontCache[key] = { css: faces.join(''), family: "'" + f.family + "', " + f.fallback };
  } catch (e) { console.warn('font fallback', e); dkFontCache[key] = { css: '', family: f.fallback }; }
  return dkFontCache[key];
}

// parts: [{el, orientation:'portrait'|'landscape', margin, breakAt, fitMin, numbered}]
// .keep = متتقسمش على صفحتين، .pb = يبدأ في صفحة جديدة
async function dkPdfParts(parts) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) throw dkErr('NO_LIB', 'مكتبة PDF مش محمّلة. اتأكد من النت.');
  const doc = { pdf: null, numbered: [] };
  doc.page = (orientation, numbered) => {
    if (!doc.pdf) doc.pdf = new J({ orientation, unit: 'mm', format: 'a4', compress: true });
    else doc.pdf.addPage('a4', orientation);
    if (numbered) doc.numbered.push({ i: doc.pdf.getNumberOfPages(), label: typeof numbered === 'string' ? numbered : '' });
    return doc.pdf;
  };
  for (const part of parts) await dkRenderPart(part, doc);
  const pdf = doc.pdf, total = pdf.getNumberOfPages();
  doc.numbered.forEach(n => {
    pdf.setPage(n.i); pdf.setFontSize(8); pdf.setTextColor(130);
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.text(n.i + ' / ' + total, w - 10, h - 6, { align: 'right' });
    if (n.label) pdf.text(n.label, 10, h - 6);
  });
  return pdf.output('blob');
}
async function dkHtmlToPdf(el, opts) { return dkPdfParts([Object.assign({ el }, opts || {})]); }

async function dkRenderPart(part, doc) {
  const el = part.el, orient = part.orientation === 'landscape' ? 'landscape' : 'portrait';
  const margin = part.margin || 8;
  const pageWmm = orient === 'landscape' ? 297 : 210, pageHmm = orient === 'landscape' ? 210 : 297;
  const contentWmm = pageWmm - margin * 2, contentHmm = pageHmm - margin * 2 - (part.numbered ? 3 : 0);
  const W = Math.round(contentWmm * 3.78);   // عرض المحتوى بالبكسل (96dpi)
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + W + 'px;background:#fff;z-index:-1';
  host.appendChild(el); document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 60));
    const H = Math.ceil(el.scrollHeight) + 4;   // +4: آخر خط في الجدول بيطلع بره حدود العنصر بنص بكسل
    const top0 = el.getBoundingClientRect().top;
    const tops = sel => [...el.querySelectorAll(sel)].map(n => n.getBoundingClientRect().top - top0);
    // مننقطعش الصفحة بعد عنوان على طول، ولا بين رأس الجدول وأول صف فيه
    const noCut = tops('h1 + *, h2 + *, h3 + *, thead + tbody > tr:first-child, .hs-item + *');
    const cuts = tops(part.breakAt || 'tr,section,header,h1,h2,.keep').filter(y => y > 0 && !noCut.some(n => Math.abs(n - y) < 3)).sort((a, b) => a - b);
    const forced = tops('.pb').filter(y => y > 2).sort((a, b) => a - b);
    const avoid = [...el.querySelectorAll('.keep')].map(n => { const r = n.getBoundingClientRect(); return [r.top - top0, r.bottom - top0]; });
    const xhtml = new XMLSerializer().serializeToString(el);
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '"><foreignObject x="0" y="0" width="' + W + '" height="' + H + '">' + xhtml + '</foreignObject></svg>';
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(dkErr('RENDER', 'تعذر تجهيز الصفحة')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    if (img.decode) { try { await img.decode(); } catch (e) { } }
    const pxPerMm = W / contentWmm, pageHpx = contentHmm * pxPerMm;
    // سفاري (الآيفون) أحيانًا بيرسم الخط والصور فاضيين أول مرة، فبنرسم الصفحة كام مرة قبل ما ناخدها
    if (/iP(hone|ad|od)/.test(navigator.userAgent) || /^((?!chrome|chromium|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent)) {
      const warm = document.createElement('canvas'); warm.width = W; warm.height = Math.min(H, Math.ceil(pageHpx));
      for (let i = 0; i < 3; i++) { try { warm.getContext('2d').drawImage(img, 0, 0); } catch (e) { } await new Promise(r => setTimeout(r, 150)); }
    }
    const scale = part.scale || 2.4;
    // بيرسم جزء من الصورة على canvas ويرجّعه JPEG (في بعض أجهزة الآيفون بيرمي خطأ هنا، وساعتها بنحوّل للطباعة)
    const jpeg = (y, h) => {
      const cv = document.createElement('canvas');
      cv.width = Math.round(W * scale); cv.height = Math.round(h * scale);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, y, W, h, 0, 0, cv.width, cv.height);
      return cv.toDataURL('image/jpeg', 0.92);
    };
    // لو المحتوى أطول من صفحة بشوية، بنصغّره عشان ييجي في صفحة واحدة (زي المستخلص الورقي)
    if (part.fitMin && H > pageHpx && pageHpx / H >= part.fitMin) {
      const wmm = contentWmm * pageHpx / H, data = jpeg(0, H);
      doc.page(orient, part.numbered ? (/^[\x20-\x7E]*$/.test(part.footer || '') && part.footer ? part.footer : true) : false).addImage(data, 'JPEG', margin + (contentWmm - wmm) / 2, margin, wmm, contentHmm, undefined, 'FAST');
      return;
    }
    let y = 0;
    while (y < H - 2) {
      let end = Math.min(H, y + pageHpx);
      const fb = forced.find(t => t > y + 2 && t < end);
      if (fb) end = fb;
      else if (end < H) {
        const inside = avoid.find(a => a[0] < end && a[1] > end && a[0] > y + 20);
        const c = cuts.filter(t => t > y + 40 && t <= end);
        if (inside) end = inside[0]; else if (c.length) end = c[c.length - 1];
      }
      const h = end - y, data = jpeg(y, h);
      doc.page(orient, part.numbered ? (/^[\x20-\x7E]*$/.test(part.footer || '') && part.footer ? part.footer : true) : false).addImage(data, 'JPEG', margin, margin, contentWmm, h / pxPerMm, undefined, 'FAST');
      y = end;
    }
  } finally { host.remove(); }
}

// مشاركة ملف: لو المتصفح طلب ضغطة جديدة (زي الآيفون) بنظهر زرار مشاركة، ولو المشاركة مش مدعومة بننزّل الملف
function dkDownload(file) { const url = URL.createObjectURL(file), a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000); }
async function dkShareFile(file, text, title) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title, text }); return 'shared'; }
    catch (e) {
      if (e.name === 'AbortError') return 'aborted'; if (e.name !== 'NotAllowedError') throw e;
      return new Promise(res => {
        const ov = document.createElement('div'); ov.className = 'dk-overlay';
        ov.innerHTML = '<div class="dk-sheet"><h3>✓ الملف جاهز</h3><p class="dk-muted">' + dkEsc(file.name) + '</p><button type="button" class="dk-btn dk-wa">📤 مشاركة على واتساب</button><button type="button" class="dk-btn light">إلغاء</button></div>';
        document.body.appendChild(ov);
        ov.querySelector('.dk-wa').onclick = () => { ov.remove(); navigator.share({ files: [file], title, text }).then(() => res('shared')).catch(() => res('aborted')); };
        ov.querySelector('.light').onclick = () => { ov.remove(); res('aborted'); };
      });
    }
  }
  dkDownload(file); return 'downloaded';
}

}

// [الرقم زي ما بيتكتب, الرقم بكود الدولة]. ممكن تزود أو تشيل أرقام من هنا.
const WA_PHONES = [['01003833499', '201003833499'], ['01226368072', '201226368072']];
function dkWaUrl(text, phone) { const p = String(phone || '').replace(/\D/g, ''); return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text); }
function dkNowAr() { return new Date().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' }); }
function dkBlobBase64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }
// بيرفع الـ PDF على الدرايف (فولدر «ملفات PDF») ويرجّع لينك يتبعت في رسالة الواتساب
async function dkSavePdf(file, kind, ref) {
  if (!API_URL || !file) return '';
  try { const r = await dkCall('pdf.save', { kind, ref, name: file.name, file: { name: file.name, mime: 'application/pdf', base64: await dkBlobBase64(file) } }); return r.url || ''; }
  catch (e) { console.warn('pdf upload', e); return ''; }
}
function dkSheetCss() {
  if (document.getElementById('dkSheetCss')) return;
  const s = document.createElement('style'); s.id = 'dkSheetCss';
  s.textContent = '.dk-wa{background:#168447}.dk-wa-preview{white-space:pre-wrap;background:#f6f8f7;border:1px solid #e3e8e5;border-radius:10px;padding:10px;font-size:12px;max-height:22vh;overflow:auto;font-family:inherit;direction:rtl;text-align:right;margin:8px 0 4px}'
    + '.dk-sep{font-size:12px;font-weight:700;color:#4b5a52;margin:14px 0 2px;border-top:1px solid #e6ebe8;padding-top:10px}.dk-pstat{display:flex;gap:8px;align-items:center;font-size:13px;background:#f3f6f4;border-radius:10px;padding:10px;margin-top:8px;line-height:1.6}'

// شاشة الإرسال بعد أي حفظ:
// o = {title, hint, text, file, makePdf: async () => ({file, kind, ref}), auto: true/false, onPrint}
// auto: الـ PDF بيتعمل لوحده أول ما الشاشة تفتح. من غيرها بيظهر زرار «طلّع PDF».
function dkSendSheet(o) {
  o = o || {}; dkSheetCss();
  const st = { file: o.file || null, url: '', pdf: o.file ? 'ready' : o.makePdf ? (o.auto ? 'making' : 'idle') : 'none', err: '', done: {} };
  const ov = document.createElement('div'); ov.className = 'dk-overlay';
  document.body.appendChild(ov);
  const msg = () => (o.text || '') + (st.url ? '\n\n📎 ملف الـ PDF: ' + st.url : '');
  const canShare = f => !!(f && navigator.canShare && navigator.canShare({ files: [f] }));
  const btn = (key, cls, label) => `<button type="button" class="dk-btn ${cls}${st.done[key] ? ' done' : ''}" data-k="${key}">${label}${st.done[key] ? ' ✓' : ''}</button>`;
  function draw() {
    let pdf = '';
    const fileBtns = () => btn('dl', 'blue', '⬇️ تحميل الـ PDF') + (canShare(st.file) ? btn('share', 'dk-wa', '📎 ابعت ملف الـ PDF نفسه (اختار الشات)') : '');
    if (st.pdf === 'making') pdf = '<div class="dk-pstat"><span class="dk-spin"></span><span>جارٍ تجهيز الـ PDF بالبيانات اللي اتكتبت…</span></div>';
    else if (st.pdf === 'uploading') pdf = fileBtns() + '<div class="dk-pstat"><span class="dk-spin"></span><span>جارٍ رفع الـ PDF على الدرايف عشان لينكه يتبعت مع الرسالة…</span></div>';
    else if (st.pdf === 'ready') pdf = fileBtns() + (st.url ? '<p class="dk-ok">☁️ الـ PDF اتحفظ على الدرايف ولينكه هيتبعت مع الرسالة.</p>' : '');
    else if (st.pdf === 'idle') pdf = btn('make', 'blue', '📄 طلّع PDF');
    else if (st.pdf === 'error') pdf = `<p class="dk-err">${dkEsc(st.err)}</p>` + btn('make', 'light', '🔁 جرب تاني') + (o.onPrint ? btn('print', 'light', '🖨️ افتح نسخة الطباعة واحفظها PDF') : '');
    const busy = st.pdf === 'making' || st.pdf === 'uploading';
    ov.innerHTML = `<div class="dk-sheet"><h3>${dkEsc(o.title || '✓ اتحفظ في السيستم')}</h3>${o.hint ? `<p class="dk-muted">${dkEsc(o.hint)}</p>` : ''}${pdf}
      <div class="dk-sep">ابعت على واتساب</div>
      ${WA_PHONES.map((p, i) => btn('n' + i, 'dk-wa', `💬 ابعت لـ <span dir="ltr">${p[0]}</span>`)).join('')}
      ${btn('other', 'light', '💬 ابعت لشات أو جروب تاني')}
      ${busy ? '<p class="dk-muted" style="margin-top:6px">لو استنيت ثواني لحد ما الـ PDF يجهز، لينكه هيتبعت مع الرسالة.</p>' : ''}
      <pre class="dk-wa-preview"></pre>
      <button type="button" class="dk-btn light dk-wa-skip dk-close">تمام</button></div>`;
    ov.querySelector('pre').textContent = msg();
    ov.querySelectorAll('[data-k]').forEach(b => b.onclick = () => act(b.dataset.k));
    ov.querySelector('.dk-close').onclick = () => ov.remove();
  }
  function mark(k) { st.done[k] = 1; draw(); }
  function act(k) {
    if (k === 'dl') { dkDownload(st.file); mark(k); }
    else if (k === 'share') navigator.share({ files: [st.file], title: st.file.name, text: o.text ? o.text.split('\n')[0].replace(/\*/g, '') : st.file.name }).then(() => mark(k)).catch(() => { });
    else if (k === 'make') make();
    else if (k === 'print') { ov.remove(); o.onPrint(); }
    else if (k === 'other') { window.open(dkWaUrl(msg(), ''), '_blank'); mark(k); }
    else if (k[0] === 'n') { window.open(dkWaUrl(msg(), WA_PHONES[+k.slice(1)][1]), '_blank'); mark(k); }
  }
  async function make() {
    st.pdf = 'making'; draw();
    try {
      const r = await o.makePdf();
      if (!r || !r.file || r.file.size < 1000) throw new Error('empty');
      st.file = r.file; st.pdf = API_URL && r.kind ? 'uploading' : 'ready'; draw();
      if (st.pdf === 'uploading') { st.url = await dkSavePdf(r.file, r.kind, r.ref); st.pdf = 'ready'; if (document.body.contains(ov)) draw(); }
    } catch (e) {
      console.error(e); st.pdf = 'error';
      st.err = e && e.code === 'NO_LIB' ? e.message : 'الـ PDF المباشر مش شغال على الجهاز ده.';
      if (document.body.contains(ov)) draw();
    }
  }
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  draw();
  if (st.pdf === 'making') make();
  return ov;
}

async function load(silent){
 if(!API_URL){conn={mode:'noapi'};render();return}
 if(!silent)dkBusy(true,'جارٍ تحميل البيانات…');
 try{await dkEnsurePin(OPEN_PIN);const r=await dkCall('claims.load',{},OPEN_PIN);announceNew(r.data);setData(r.data);conn={mode:'online',loadedAt:Date.now(),rev:r.data.rev}}
 catch(e){const cache=readCache();if(cache){db=cache.data;conn={mode:'cache',msg:e.message,at:cache.at}}else conn={mode:'error',msg:e.message}}
 finally{dkBusy(false);render()}
}
function setData(d){db={projects:d.projects||[],subs:d.subs||[],claims:d.claims||[],events:d.events||[],lines:d.lines||[],docs:d.docs||[]};seenEvents=new Set(db.events.map(e=>e.id));try{localStorage.setItem(CACHE_KEY,JSON.stringify({data:db,at:new Date().toLocaleString('ar-EG')}))}catch(e){}}
function readCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(e){return null}}
// لما حد تاني يعدّل (زي المندوب في المديرية) بيظهر إشعار والصفحة بتتحدث لوحدها
function announceNew(d){if(!seenEvents)return;const me=dkGetName();const fresh=(d.events||[]).filter(e=>!seenEvents.has(e.id)&&e.by!==me);if(!fresh.length)return;const e=fresh[fresh.length-1];toast(`🔔 ${e.by}: ${e.status}${e.claimLabel?' · '+e.claimLabel:''}${fresh.length>1?` (و${fresh.length-1} تعديل تاني)`:''}`,5000)}
async function poll(){if(conn.mode!=='online'||document.visibilityState!=='visible'||document.getElementById('modal').style.display==='flex'||document.querySelector('.dk-overlay'))return;
 try{const r=await dkApi('claims.rev');if(r.rev&&r.rev!==conn.rev)await load(true)}catch(e){}}
async function mutate(action,payload,okMsg,busyText,wa){
 if(conn.mode==='noapi'){toast('السيستم لسه مش متوصل');return false}
 dkBusy(true,busyText||'جارٍ الحفظ…');
 try{const r=await dkCall(action,payload,OPEN_PIN);setData(r.data);conn={mode:'online',loadedAt:Date.now(),rev:r.data.rev};closeModal();render();
  if(wa&&askWa()){dkBusy(false);const cid=state.claim&&C(state.claim)?state.claim:null;dkSendSheet({title:'✓ '+(okMsg||'اتحفظ'),text:wa(),makePdf:cid?()=>makeClaimStatusPdf(cid):null,auto:false})}else if(okMsg)toast(okMsg);return true}
 catch(e){toast(e.code==='NETWORK'?'مفيش نت. التعديل متحفظش، جرب تاني':e.message);return false}
 finally{dkBusy(false)}
}

 else if(state.screen==='projects'){h=header('المشاريع');m=projects()}
 else if(state.screen==='claims'){h=header('المستخلصات');m=claimsScreen()}
 else if(state.screen==='log'){h=header('سجل التعديلات');m=logScreen()}
 else if(state.screen==='docs'){h=header('المستندات');m=docsScreen()}
 else if(state.screen==='project'){h=header('تفاصيل المشروع',true);m=projectView()}
 else if(state.screen==='sub'){h=header('مشروع فرعي',true);m=subView()}
 else if(state.screen==='claim'){h=header('تفاصيل المستخلص',true);m=claimView()}
 if(conn.mode==='loading')m='<div class="empty">جارٍ التحميل…</div>';
 const sameScreen=render._last===state.screen+'|'+state.claim+'|'+state.sub+'|'+state.project;render._last=state.screen+'|'+state.claim+'|'+state.sub+'|'+state.project;const q=sameScreen?(document.querySelector('#main .search input')?.value||''):'';
 document.getElementById('header').innerHTML=h;document.getElementById('main').innerHTML=connBar()+m;
 const qi=document.querySelector('#main .search input');if(q&&qi){qi.value=q;filterCards(q)}
 document.querySelectorAll('.nav').forEach((x,i)=>x.classList.toggle('active',NAV[i]===state.screen));
}
function filterCards(q){q=q.trim();document.querySelectorAll('#cards > [data-search]').forEach(c=>c.style.display=!q||(c.dataset.search||'').includes(q)?'':'none')}

// ===== النماذج =====
function modal(content){document.getElementById('sheet').innerHTML=content;document.getElementById('modal').style.display='flex';setTimeout(()=>{const f=document.querySelector('#sheet input:not([type=file]):not([type=checkbox]),#sheet textarea,#sheet select');if(f&&!f.value)f.focus()},50)}
function closeModal(){document.getElementById('modal').style.display='none'}
function val(id){return (document.getElementById(id)?.value||'').trim()}
function opts(list,sel){return list.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}
function datalist(id,list){return `<datalist id="${id}">${list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`}
const today=todayLocal;

function projectForm(id){const p=id?P(id):{};modal(`<h3>${id?'تعديل المشروع':'إضافة مشروع رئيسي'}</h3><div class="form"><label>اسم المشروع</label><input class="input" id="f1" value="${esc(p.name||'')}" placeholder="مثال: حي شرق السنوية"><div class="grid2"><div><label>تاريخ البداية</label><input class="input" id="f2" type="date" value="${esc(p.start||today())}"></div><div><label>مدة المشروع بالأيام</label><input class="input" id="f3" type="number" inputmode="numeric" value="${esc(p.duration||365)}"></div></div><button class="primary" style="width:100%;margin-top:14px" onclick="saveProject('${id||''}')">حفظ المشروع</button></div>`)}
function saveProject(id){const name=val('f1');if(!name)return toast('اكتب اسم المشروع');mutate('claims.upsert',{table:'projects',row:{id:id||undefined,name,start:val('f2'),duration:Number(val('f3'))||365}},'تم حفظ المشروع')}
function subForm(id){const s=id?S(id):{};const p=P(id?s.projectId:state.project);if(!p)return toast('افتح مشروعًا رئيسيًا أولًا');modal(`<h3>${id?'تعديل المشروع الفرعي':'إضافة مشروع فرعي'}</h3><div class="form"><label>تابع إلى</label><select class="select" disabled><option>${esc(p.name)}</option></select><label>اسم المشروع الفرعي / الشارع</label><input class="input" id="sf1" value="${esc(s.name||'')}" placeholder="مثال: شارع مصطفى كامل"><button class="primary" style="width:100%;margin-top:14px" onclick="saveSub('${id||''}','${p.id}')">حفظ</button></div>`)}
function saveSub(id,pid){const name=val('sf1');if(!name)return toast('اكتب اسم المشروع الفرعي');mutate('claims.upsert',{table:'subs',row:{id:id||undefined,projectId:pid,name}},'تم الحفظ')}
function claimForm(id){const c=id?C(id):null;const s=S(c?c.subId:state.sub);if(!s)return toast('افتح مشروع فرعي الأول');const nextNo=claimsOf(s.id).filter(x=>x.type!=='ختامية').length+1;
 modal(`<h3>${c?'تعديل بيانات المستخلص':'إضافة مستخلص'}</h3><div class="form"><label>نوع المستخلص</label><select class="select" id="cf1">${opts(['جاري','ختامية'],c?.type||'جاري')}</select><div class="grid2"><div><label>رقم المستخلص</label><input class="input" id="cf2" type="number" inputmode="numeric" value="${esc(c?c.no:nextNo)}"></div><div><label>القيمة (ج.م)</label><input class="input" id="cf3" type="number" inputmode="decimal" value="${esc(c?c.value:'')}"></div></div>${c?'':`<label>الحالة الحالية</label><select class="select" id="cf4">${opts(STATUSES.slice(0,7),'تحت المراجعة')}</select>`}<label>ملاحظة المرحلة</label><textarea class="textarea" id="cf5" placeholder="مثال: لدى الإدارة المالية لمراجعة الخصومات">${esc(c?.note||'')}</textarea><label>تاريخ التقديم</label><input class="input" id="cf6" type="date" value="${esc(c?.date||today())}">${c?'<p class="small">أي تعديل هنا بيتسجل في سجل الحركة باسمك. الحالة بتتغير من زرار «تحديث الحالة».</p>':'<p class="small">القيمة = قيمة الأعمال الإجمالية زي ما هي في المستخلص الورقي.</p>'}<button class="primary" style="width:100%;margin-top:14px" onclick="saveClaim('${id||''}','${s.id}')">حفظ المستخلص</button></div>`)}
function saveClaim(id,sid){const s=S(sid),value=Number(val('cf3'));if(!val('cf3')||!(value>=0))return toast('اكتب قيمة المستخلص');const no=Number(val('cf2'))||1,type=val('cf1');
 const dup=claimsOf(sid).find(x=>x.id!==id&&x.type===type&&(type==='ختامية'||Number(x.no)===no));if(dup&&!confirm(type==='ختامية'?'فيه ختامية متسجلة للشارع ده قبل كده. تكمل؟':'فيه مستخلص رقم '+no+' متسجل للشارع ده قبل كده. تكمل؟'))return;
 const row={id:id||undefined,projectId:s.projectId,subId:sid,type,no,value,note:val('cf5'),date:val('cf6')};if(!id)row.status=val('cf4');
 const before=new Set(db.claims.map(c=>c.id));
 mutate('claims.upsert',{table:'claims',row},id?'اتعدلت بيانات المستخلص':'اتسجل المستخلص',null,()=>{const n=id?C(id):db.claims.find(c=>!before.has(c.id));return n?waMsg(n,id?'✏️ تعديل بيانات المستخلص':'🆕 مستخلص جديد اتسجل'):''}).then(ok=>{if(ok&&!id){const n=db.claims.find(c=>!before.has(c.id));if(n)openClaim(n.id)}})}
function statusForm(){const c=C(state.claim),k=calcClaim(c);modal(`<h3>تحديث حالة المستخلص</h3><div class="form"><label>الحالة الجديدة</label><select class="select" id="st1" onchange="document.getElementById('payBox').style.display=this.value==='تم الصرف'&&${k.dueNow}>0?'block':'none'">${opts(STATUSES,c.status)}</select><label>إيه اللي حصل؟</label><textarea class="textarea" id="st2" placeholder="مثال: اتسلم للمراجعة الفنية في الأكاديمية">${esc(c.note||'')}</textarea><div id="payBox" class="card" style="display:${c.status==='تم الصرف'&&k.dueNow>0?'block':'none'};background:#f6fbf8"><label style="margin-top:0"><input type="checkbox" id="st3" checked style="width:auto"> سجّل دفعة باللي اتصرف</label><input class="input" id="st4" type="number" inputmode="decimal" value="${k.dueNow}"><p class="small">المستحق للصرف دلوقتي ${money(k.dueNow)}${k.held?` (من غير ${money(k.held)} معلّق)`:''}. عدّل الرقم لو اللي اتصرف مختلف.</p></div><button class="primary" style="width:100%;margin-top:14px" onclick="saveStatus()">حفظ التحديث</button></div>`)}
function saveStatus(){const status=val('st1'),note=val('st2'),pay=status==='تم الصرف'&&document.getElementById('st3')?.checked&&document.getElementById('payBox').style.display!=='none'?Number(val('st4'))||0:0;const id=state.claim;
 mutate('claims.status',{claimId:id,status,note,paymentValue:pay},'اتحدثت الحالة',null,waAfter(id,`🔄 الحالة بقت: *${status}*${note?'\n📝 '+note:''}${pay?'\n💵 اتسجلت دفعة: '+money(pay):''}`))}
function commentForm(){const c=C(state.claim);modal(`<h3>تعليق / متابعة</h3><p class="small">${esc(claimPath(c))}</p><div class="form"><label>إيه اللي حصل النهارده؟</label><textarea class="textarea" id="cm1" placeholder="مثال: المراجع طلب صورة محضر الاستلام. هسلمها بكرة."></textarea><button class="primary" style="width:100%;margin-top:14px" onclick="saveComment()">حفظ التعليق</button></div>`)}
function saveComment(){const text=val('cm1');if(!text)return toast('اكتب التعليق');const id=state.claim;mutate('claims.comment',{claimId:id,text},'اتسجل التعليق',null,waAfter(id,'💬 '+text))}
function lineForm(kind){const L={ded:['إضافة خصم / استقطاع','نوع الخصم',DED_TYPES,'اختياري'],add:['إضافة تعلية (مبلغ متعلّق)','سبب التعلية',HOLD_TYPES,'رقم البند المتعلّق مثلًا'],pay:['إضافة دفعة محصّلة','طريقة الدفع / البيان',PAY_TYPES,'رقم الشيك أو التحويل مثلًا']}[kind];
 modal(`<h3>${L[0]}</h3><div class="form"><label>${L[1]}</label><input class="input" id="lf1" list="lfl" placeholder="اختار أو اكتب">${datalist('lfl',L[2])}<label>القيمة (ج.م)</label><input class="input" id="lf2" type="number" inputmode="decimal"><label>التاريخ</label><input class="input" id="lf4" type="date" value="${today()}"><label>ملاحظة</label><input class="input" id="lf5" placeholder="${L[3]}"><button class="primary" style="width:100%;margin-top:14px" onclick="saveLine('${kind}')">حفظ</button></div>`)}
function saveLine(kind){const name=val('lf1'),value=Number(val('lf2')),note=val('lf5');if(!name)return toast('اكتب البيان');if(!(value>0))return toast('اكتب القيمة');const id=state.claim;
 const icon={ded:'➖ خصم',add:'⏸️ تعلية (مبلغ متعلّق)',pay:'💵 دفعة اتحصّلت'}[kind];
 mutate('claims.addLine',{claimId:id,kind,line:{name,value,date:val('lf4'),note}},'تمت الإضافة',null,waAfter(id,`${icon}: ${name} = ${money(value)}${note?' ('+note+')':''}`))}
function toggleHold(lineId){const l=db.lines.find(x=>x.id===lineId);if(!l)return;const release=l.status!==RELEASED;const note=prompt(release?'فك التعلية: إيه اللي اتحقق؟ (اختياري)':'سبب إعادة التعلية؟ (اختياري)','');if(note===null)return;
 mutate('claims.lineStatus',{lineId,status:release?RELEASED:HELD,note},release?'اتفكت التعلية':'اتعلّقت تاني',null,waAfter(l.claimId,`${release?'▶️ فك تعلية':'⏸️ إعادة تعلية'}: ${l.name} = ${money(l.value)}${note?' ('+note+')':''}`))}
function docForm(){modal(`<h3>رفع مستند</h3><div class="form"><label>اسم المستند</label><input class="input" id="df1" list="dfl" placeholder="مثال: خطاب التقديم">${datalist('dfl',['خطاب التقديم','نسخة المستخلص','محضر الاستلام','الاعتماد','إيصال الصرف','الشيك'])}<label>الملف (صورة أو PDF)</label><input class="input" id="df2" type="file" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx"><p class="small">الصور بتتصغر تلقائي قبل الرفع. أقصى حجم 20 ميجا.</p><button class="primary" style="width:100%;margin-top:14px" onclick="saveDoc()">رفع</button></div>`)}
async function saveDoc(){const f=document.getElementById('df2').files[0];if(!f)return toast('اختار الملف');if(f.size>20*1024*1024)return toast('الملف أكبر من 20 ميجا');
 let dataUrl,mime=f.type||'application/octet-stream',fname=f.name;
 if(mime.startsWith('image/')){dataUrl=await dkShrinkImage(f,2000,0.8);mime='image/jpeg';fname=fname.replace(/\.\w+$/,'')+'.jpg'}else dataUrl=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
 const p=dkDataUrlParts(dataUrl);if(!p)return toast('تعذر قراءة الملف');const id=state.claim,name=val('df1')||f.name;
 mutate('claims.addDoc',{claimId:id,name,file:{name:fname,mime,base64:p.base64}},'اترفع المستند','جارٍ رفع المستند…',()=>{const d=db.docs.filter(x=>x.claimId===id).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];return waMsg(C(id),`📎 مستند جديد: ${name}${d?'\n'+d.url:''}`)})}
function removeItem(table,id){let label='',claimId=null;if(table==='projects')label='المشروع «'+(P(id)?.name||'')+'» وكل مشاريعه الفرعية ومستخلصاته';else if(table==='subs')label='«'+(S(id)?.name||'')+'» وكل مستخلصاته';else if(table==='claims')label=claimTitle(C(id))+' بكل بنوده';else if(table==='lines'){const l=db.lines.find(x=>x.id===id);claimId=l?.claimId;label=(l?.kind||'')+' «'+(l?.name||'')+'» ('+money(l?.value)+')'}else{const d=db.docs.find(x=>x.id===id);claimId=d?.claimId;label='المستند «'+(d?.name||'')+'»'}
 if(!confirm('متأكد إنك عايز تحذف '+label+'؟\nالحذف بيتسجل باسمك، والبيانات بتفضل محفوظة في الشيت كـ"محذوف".'))return;
 mutate('claims.delete',{table,id},'تم الحذف',null,claimId?waAfter(claimId,'🗑️ حذف '+label):null).then(ok=>{if(ok&&['projects','subs','claims'].includes(table))goBack()})}
function shareWhatsApp(){const id=state.claim,c=C(id);if(!c)return;dkSendSheet({title:'📄 متابعة المستخلص',hint:'الـ PDF فيه القيمة والخصومات والتعليات والدفعات والمستندات وسجل الحركة.',text:waMsg(c,'📋 ملخص المستخلص'),makePdf:()=>makeClaimStatusPdf(id),auto:true})}
// ملخص كل تعديلات النهارده في رسالة واحدة
function sendTodayDigest(){const d=todayLocal();const ev=db.events.filter(e=>String(e.at).startsWith(d)&&(e.claimId||/مستخلص/.test(e.status))).sort((a,b)=>String(a.at).localeCompare(String(b.at)));if(!ev.length)return toast('مفيش تعديلات النهارده');
 const groups={};ev.forEach(e=>{const k=e.claimLabel||'عام';(groups[k]=groups[k]||[]).push(e)});
 let m=`*الضمراني · ملخص متابعة المستخلصات*\n📅 ${new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'numeric',day:'numeric'})}\n`;
 Object.keys(groups).forEach(k=>{m+=`\n📌 *${k}*\n`;groups[k].forEach(e=>{m+=`• ${String(e.at).slice(11,16)} ${e.status}${e.note?': '+e.note:''} (${e.by})\n`});const c=groups[k][0].claimId&&C(groups[k][0].claimId);if(c){const kk=calcClaim(c);m+=`  الحالة: ${c.status} · المتبقي ${money(kk.remaining)}${kk.held?' (معلّق '+money(kk.held)+')':''}\n`}});
 dkSendSheet({title:'📲 ملخص تعديلات النهارده',text:m})}
function openMenu(){modal(`<h3>القائمة</h3><p class="small">داخل باسم: <b>${esc(dkGetName()||'غير محدد')}</b></p><button class="outline" style="width:100%;margin-top:8px" onclick="closeModal();load()">🔄 تحديث البيانات</button><button class="outline" style="width:100%;margin-top:8px" onclick="closeModal();sendTodayDigest()">📲 ابعت ملخص تعديلات النهارده</button><label class="menu-check"><input type="checkbox" ${askWa()?'checked':''} onchange="dkLS(ASK_WA_KEY,this.checked?'on':'off')"> اسألني أبعت واتساب بعد كل تعديل</label><button class="outline" style="width:100%;margin-top:8px" onclick="changeName()">✎ تغيير الاسم</button><button class="danger" style="width:100%;margin-top:8px" onclick="logout()">خروج من الجهاز ده</button>`)}
function changeName(){const n=prompt('اسمك اللي هيتسجل مع التعديلات:',dkGetName());if(n&&n.trim()){dkLS(NAME_KEY,n.trim());closeModal();toast('تم تغيير الاسم')}}
function logout(){if(!confirm('هتمسح الرمز والاسم من الجهاز ده؟'))return;dkLS(PIN_KEY,null);dkLS(NAME_KEY,null);try{localStorage.removeItem(CACHE_KEY)}catch(e){}location.reload()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()});
window.addEventListener('online',()=>{if(conn.mode==='cache'||conn.mode==='error')load(true)});
setInterval(poll,25000);
render();load();

</script>
